name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Validate delivery branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate pull request route
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/validate-delivery-route.sh "$BASE_REF" "$HEAD_REF" "$PR_TITLE"

  studio-build:
    name: Build Style Studio
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test model type contracts
        run: pnpm model-types:test

      - name: Test modular pipeline artifact contracts
        run: pnpm pipeline-contracts:test

      - name: Test semantic reference analysis
        run: pnpm semantic-analysis:test

      - name: Test persistent build jobs
        run: pnpm build-jobs:test

      - name: Test reference analysis
        run: pnpm reference-analysis:test

      - name: Test animation clip catalog
        run: pnpm animation-catalog:test

      - name: Test final GLB Studio workflow
        run: pnpm final-workflow:test

      - name: Test guided Studio readiness gates
        run: pnpm --filter @low-poly-character-studio/api exec tsx --test ../style-studio/src/guided-studio-shell.test.ts

      - name: Test humanoid model runner
        run: pnpm model-runner:test

      - name: Test humanoid rig runner
        run: pnpm rig-runner:test

      - name: Test humanoid animation runner
        run: pnpm animation-runner:test

      - name: Build Style Studio
        run: pnpm studio:build

      - name: Capture responsive Studio review screenshots
        run: bash scripts/capture-responsive-studio.sh

      - name: Upload responsive Studio review evidence
        uses: actions/upload-artifact@v4
        with:
          name: responsive-studio-review-${{ github.sha }}
          path: image-analysis/output/responsive-studio
          if-no-files-found: error
          retention-days: 14

      - name: Write delivery metadata
        if: github.event_name == 'push'
        run: |
          mkdir -p delivery-metadata
          cat > delivery-metadata/build.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "branch": "${GITHUB_REF_NAME}",
            "commit": "${GITHUB_SHA}",
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "runUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload branch delivery artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: style-studio-${{ github.ref_name }}-${{ github.sha }}
          path: |
            apps/style-studio/dist
            delivery-metadata/build.json
          if-no-files-found: error
          retention-days: 30

  source-validation:
    name: Validate scripts
    needs: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Test delivery route policy
        run: bash scripts/test-delivery-route.sh

      - name: Test humanoid StyleDNA contracts
        run: python3 packages/asset-compiler/blender/tests/test_style_dna.py

      - name: Test Chibi style-kit assembly and review contracts
        run: |
          python3 packages/asset-compiler/blender/tests/test_style_kit.py
          python3 packages/asset-compiler/blender/tests/test_style_review.py

      - name: Test manifest compiler contracts without Blender
        run: python3 packages/asset-compiler/compiler/test_manifest_contract.py

      - name: Test humanoid rig contracts
        run: python3 packages/asset-compiler/blender/tests/test_rig_contract.py

      - name: Test localized underarm web weights
        run: python3 packages/asset-compiler/blender/tests/test_underarm_web_weights.py

      - name: Test humanoid animation pack contracts
        run: python3 packages/asset-compiler/blender/tests/test_animation_pack.py

      - name: Compile Python sources
        run: python3 -m compileall -q packages/asset-compiler/compiler packages/asset-compiler/blender/generator packages/asset-compiler/blender/scripts

  blender-rig-smoke:
    name: Blender rig and animation smoke test
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Cache Blender toolchain
        uses: actions/cache@v4
        with:
          path: .tools/blender
          key: blender-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.blender-version', 'scripts/setup-blender.sh') }}

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libegl1 \
            libgl1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libxfixes3 \
            libxi6 \
            libxkbcommon0 \
            libxrender1 \
            libxxf86vm1

      - name: Set up pinned Blender
        id: blender
        run: pnpm blender:setup

      - name: Compile compact and tall manifests through Blender
        env:
          BLENDER_COMMAND: ${{ steps.blender.outputs.executable }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' pnpm manifest-compiler:smoke

      - name: Generate compact and tall rig review
        env:
          BLENDER_COMMAND: ${{ steps.blender.outputs.executable }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' pnpm rig-review

      - name: Generate compact and tall animation outputs
        env:
          BLENDER_COMMAND: ${{ steps.blender.outputs.executable }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' bash scripts/run-animation-smoke.sh

      - name: Build and review Chibi style-kit configurations
        env:
          BLENDER_COMMAND: ${{ steps.blender.outputs.executable }}
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 1280x1024x24' python3 scripts/chibi_style_review.py --output-dir image-analysis/output/chibi-style-review

      - name: Upload Blender review diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: humanoid-rig-animation-review-${{ github.sha }}
          path: |
            image-analysis/output/pr-21-rig-review.zip
            image-analysis/output/pr-21-rig-review-failed.zip
            image-analysis/output/animation-smoke
            image-analysis/output/manifest-compiler-smoke
            image-analysis/output/chibi-style-review
          if-no-files-found: warn
          retention-days: 7
